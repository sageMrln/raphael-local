<h1>Raphael Local</h1>
<p>Raphael Local is a private desktop assistant run by one person on his own computer. It reads his own Google Drive and Gmail so it can sort his mail and keep his notes.</p>
<p>It is not offered to the public, and it has no other users.</p>
